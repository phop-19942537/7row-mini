<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>16-Pair (2^5) Sniper Tracker</title>
    <style>
        body { background: #111; color: #fff; font-family: sans-serif; padding: 10px; margin: 0; }
        .status { background: #222; padding: 12px; color: #ffc107; font-weight: bold; margin-bottom: 10px; border-radius: 6px; text-align: center; }
        .btn-group { display: flex; gap: 8px; margin-bottom: 10px; }
        .btn { padding: 12px; font-size: 16px; font-weight: bold; border-radius: 6px; border: none; cursor: pointer; flex: 1; color: #fff; }
        .btn-p { background: #007bff; } .btn-b { background: #dc3545; }
        .btn-sub { background: #444; padding: 6px 12px; font-size: 12px; color: #ccc; border: none; border-radius: 4px; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; font-size: 11px; margin-top: 10px; text-align: center; }
        th, td { border: 1px solid #333; padding: 5px 3px; white-space: nowrap; }
        th { background: #222; color: #aaa; }
        .win { color: #2ecc71; background: rgba(46,204,113,0.1); } 
        .loss { color: #e74c3c; background: rgba(231,76,60,0.1); }
        .active { background: #332b00 !important; color: #ffc107 !important; font-weight: bold; }
        .p-color { color: #5fb0ff; } .b-color { color: #ff5f5f; }
    </style>
</head>
<body>

    <div class="status" id="status">กรอกผล 6 ตาแรกเพื่อเริ่มสแกน (16 คู่ / 32 รูปแบบ)</div>
    
    <div class="btn-group">
        <button class="btn btn-p" onclick="add('P')">P</button>
        <button class="btn btn-b" onclick="add('B')">B</button>
    </div>
    
    <div style="margin-bottom: 10px;">
        <button class="btn-sub" onclick="undo()">Undo</button>
        <button class="btn-sub" onclick="resetAll()">Clear</button>
    </div>

    <div style="overflow-x:auto;">
        <table>
            <thead><tr id="th-row"><th>#</th><th>RES</th></tr></thead>
            <tbody id="tb-body"></tbody>
        </table>
    </div>

<script>
    const STEP_BACK = 6, MAX_STEP = 3;
    let history = JSON.parse(localStorage.getItem('h_16pairs')) || [];
    
    // สร้าง 16 คู่ (32 รูปแบบไม่ซ้ำกันจาก 2^5)
    const pairs = Array.from({length: 16}, (_, i) => {
        let m = "", r = "";
        for (let b = 4; b >= 0; b--) {
            let set = (i >> b) & 1;
            m += set ? "T" : "M"; 
            r += set ? "M" : "T";
        }
        return { name: `P${i+1}`, main: m, mirror: r };
    });

    // สร้างหัวตาราง 16 คู่
    const thr = document.getElementById('th-row');
    pairs.forEach((p, i) => {
        thr.innerHTML += `<th id="th-m-${i}">${p.name}.M</th><th id="th-r-${i}">${p.name}.R</th>`;
    });

    function add(val) { history.push(val); render(); }
    function undo() { history.pop(); render(); }
    function resetAll() { if(confirm("ล้างข้อมูลทั้งหมด?")) { history = []; render(); } }

    function getPred(pattern, idx) {
        let logic = pattern[(idx - STEP_BACK) % 5];
        let base = history[idx - STEP_BACK];
        return (logic === "M") ? base : (base === 'P' ? 'B' : 'P');
    }

    function isFail(pair, idx) {
        if (idx <= STEP_BACK) return false;
        let prev = idx - 1;
        let side = (history[prev] === getPred(pair.main, prev)) ? 'main' : 'mirror';
        return history[idx] !== getPred(pair[side], idx);
    }

    function render() {
        localStorage.setItem('h_16pairs', JSON.stringify(history));
        let activeSignal = null, step = 1, currentSignal = null;

        // สแกนหาหลุด 3 ตาติด และเดินเงินทบไม้ล็อค Pair เดิม
        for (let i = STEP_BACK + 3; i <= history.length; i++) {
            if (!activeSignal) {
                for (let idx = 0; idx < pairs.length; idx++) {
                    let c = i - 1;
                    if (c >= STEP_BACK + 2 && isFail(pairs[idx], c) && isFail(pairs[idx], c-1) && isFail(pairs[idx], c-2)) {
                        activeSignal = { pairIdx: idx }; 
                        step = 1; 
                        break;
                    }
                }
            }
            if (activeSignal) {
                let p = pairs[activeSignal.pairIdx];
                let side = (history[i-1] === getPred(p.main, i-1)) ? 'main' : 'mirror';
                let pred = getPred(p[side], i);

                if (i < history.length) {
                    if (history[i] === pred) { activeSignal = null; step = 1; }
                    else if (++step > MAX_STEP) { activeSignal = null; step = 1; }
                } else if (i === history.length) {
                    currentSignal = { pairIdx: activeSignal.pairIdx, pred, step };
                }
            }
        }

        // แสดงผล Status
        let st = document.getElementById('status');
        if (history.length < STEP_BACK) {
            st.innerText = `กรอกข้อมูลตั้งต้น: ${history.length}/${STEP_BACK}`;
        } else if (currentSignal) {
            st.innerHTML = `🎯 แทง PAIR ${currentSignal.pairIdx+1}: <span class="${currentSignal.pred==='P'?'p-color':'b-color'}">${currentSignal.pred==='P'?'PLAYER (P)':'BANKER (B)'}</span> (ไม้ ${currentSignal.step}/${MAX_STEP})`;
        } else {
            st.innerText = "☕ รอสัญญาณยิง (กำลังสแกน 16 คู่)...";
        }

        // วาดตาราง
        let tbody = document.getElementById('tb-body');
        tbody.innerHTML = "";
        pairs.forEach((_, i) => {
            document.getElementById(`th-m-${i}`).className = "";
            document.getElementById(`th-r-${i}`).className = "";
        });

        let rows = history.length + (history.length >= STEP_BACK ? 1 : 0);
        for (let i = 0; i < rows; i++) {
            let tr = tbody.insertRow();
            tr.insertCell().innerText = i + 1;
            
            let resCell = tr.insertCell();
            resCell.innerText = history[i] || "?";
            if(history[i]) resCell.className = history[i] === 'P' ? 'p-color' : 'b-color';

            if (i >= STEP_BACK) {
                pairs.forEach((p, idx) => {
                    let pM = getPred(p.main, i), pR = getPred(p.mirror, i);
                    let cM = tr.insertCell(), cR = tr.insertCell();
                    
                    if (currentSignal && currentSignal.pairIdx === idx && i === history.length) {
                        document.getElementById(`th-m-${idx}`).className = "active";
                        document.getElementById(`th-r-${idx}`).className = "active";
                    }

                    if (i < history.length) {
                        cM.className = (history[i] === pM) ? "win" : "loss";
                        cM.innerText = `${pM} ${history[i]===pM?'✅':'❌'}`;
                        cR.className = (history[i] === pR) ? "win" : "loss";
                        cR.innerText = `${pR} ${history[i]===pR?'✅':'❌'}`;
                    } else {
                        cM.innerText = pM; cR.innerText = pR;
                    }
                });
            } else {
                for(let j=0; j<32; j++) tr.insertCell().innerText = "-";
            }
        }
    }
    render();
</script>
</body>
</html>
