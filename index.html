<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>16-Pair (2^5) Sniper Tracker</title>
    <style>
        * { box-sizing: border-box; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        body { background: transparent; color: #eee; margin: 0; padding: 0; overflow: hidden; }
        
        .card { 
            background: #181818; 
            width: 100vw; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            border: 1px solid #333;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
            position: relative;
        }

        .header { 
            background: #222; 
            padding: 8px; 
            border-bottom: 1px solid #333; 
            flex-shrink: 0; 
        }

        .status-bar { 
            background: #111; 
            color: #ffc107; 
            padding: 8px; 
            border-radius: 4px; 
            font-size: 13px; 
            font-weight: bold; 
            text-align: center; 
            margin-bottom: 6px;
            border: 1px solid #444;
            min-height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .stats-row {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            margin-bottom: 6px;
            padding: 0 4px;
            color: #aaa;
        }
        .stats-row span b { color: #fff; font-size: 11px; }

        .btn-group { display: flex; gap: 4px; margin-bottom: 4px; }
        .btn { 
            border: none; padding: 12px 0; border-radius: 6px; 
            font-size: 16px; font-weight: 800; cursor: pointer; color: white; flex: 1; 
        }
        .btn-p { background: #007bff; border-bottom: 3px solid #0056b3; }
        .btn-b { background: #dc3545; border-bottom: 3px solid #a71d2a; }
        .btn:active { transform: translateY(2px); border-bottom: none; margin-bottom: 3px; }

        .btn-action { 
            background: #333; padding: 5px 8px; font-size: 10px; flex: none; 
            color: #ccc; border-radius: 4px; border:none; cursor: pointer; font-weight: bold;
        }
        
        .btn-sound {
            background: #28a745; color: #fff; font-size: 10px; padding: 5px 8px; 
            border-radius: 4px; border: none; cursor: pointer; font-weight: bold;
        }
        .btn-sound.muted { background: #6c757d; }

        .content-area {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            overflow: hidden;
        }

        .history-log-box {
            background: #141414;
            border-bottom: 1px solid #333;
            max-height: 100px;
            min-height: 70px;
            overflow-y: auto;
            padding: 6px 10px;
            font-size: 11px;
            scrollbar-width: thin;
        }
        .log-item {
            padding: 2px 0;
            border-bottom: 1px solid #222;
            display: flex;
            justify-content: space-between;
        }
        .log-win { color: #2ecc71; font-weight: bold; }
        .log-loss { color: #e74c3c; font-weight: bold; }

        .table-container { 
            flex-grow: 1; overflow-y: auto; overflow-x: auto; 
            background: #0f0f0f; scrollbar-width: thin;
        }
        
        table { width: 100%; border-collapse: collapse; font-size: 10px; text-align: center; white-space: nowrap; }
        th { 
            background: #222; color: #777; position: sticky; top: 0; 
            padding: 6px 2px; z-index: 10; border-bottom: 1px solid #444; font-size: 9px;
        }
        
        td { border-bottom: 1px solid #1f1f1f; padding: 4px 2px; font-weight: 600; }
        
        .p-text { color: #5fb0ff; }
        .b-text { color: #ff5f5f; }
        .win { background: rgba(46, 204, 113, 0.1); color: #2ecc71; }
        .loss { background: rgba(231, 76, 60, 0.1); color: #e74c3c; }
        
        .locked-col { 
            background: rgba(255, 193, 7, 0.15) !important; 
            box-shadow: inset 0 0 0 1px rgba(255, 193, 7, 0.5);
        }
        .highlight-th { color: #ffc107 !important; background: #332b00 !important; }
        
        .next-bet { 
            background: #ffc107; color: #000; padding: 2px 7px; 
            border-radius: 3px; font-weight: 900; animation: blink 1s infinite alternate;
        }
        .step-badge {
            background: #e67e22; color: #fff; padding: 1px 5px;
            border-radius: 3px; font-size: 10px; margin-left: 4px;
        }
        .wait-status { color: #888; font-weight: normal; }

        @keyframes blink {
            from { opacity: 1; } to { opacity: 0.6; }
        }

        .modal {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 100; justify-content: center; align-items: center;
        }
        .modal-content {
            background: #222; padding: 15px; border-radius: 8px; width: 85%; max-width: 320px;
            border: 1px solid #444; text-align: center;
        }
        .modal-content h3 { margin-top: 0; color: #ffc107; font-size: 16px; }
        .setting-row { margin: 15px 0; display: flex; justify-content: space-between; align-items: center; }
        .setting-row select { background: #333; color: #fff; border: 1px solid #555; padding: 5px; border-radius: 4px; }
        .btn-close { background: #007bff; color: #fff; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 10px; }
    </style>
</head>
<body>
<div class="card">
    <div class="header">
        <div id="next-info" class="status-bar">
            <span>READY - ป้อนข้อมูล 6 ตาแรก (16 คู่ / 2^5)</span>
        </div>
        
        <div class="stats-row">
            <span>WIN: <b id="stat-win">0</b></span>
            <span>LOSS: <b id="stat-loss">0</b></span>
            <span>RATE: <b id="stat-rate">0%</b></span>
            <span>MAX STEP: <b id="stat-max-step">3 ไม้</b></span>
        </div>

        <div class="btn-group">
            <button class="btn btn-p" onclick="addResult('P')">P</button>
            <button class="btn btn-b" onclick="addResult('B')">B</button>
        </div>
        
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <div>
                <button class="btn-action" onclick="undo()">Undo</button>
                <button class="btn-action" onclick="resetAll()">Clear</button>
                <button class="btn-action" onclick="openSettings()">⚙️ ตั้งค่า</button>
            </div>
            <button id="sound-btn" class="btn-sound" onclick="toggleSound()">🔊 เสียง: เปิด</button>
        </div>
    </div>

    <div class="content-area">
        <div class="history-log-box" id="history-log-box">
            <div style="color: #777; font-size: 10px; text-align: center;">--- ประวัติผลบันทึกรอบการยิงมาร์ติงเกล ---</div>
        </div>

        <div class="table-container" id="scroll-area">
            <table>
                <thead>
                    <tr id="table-head">
                        <th style="width:20px">#</th>
                        <th style="width:30px; background:#111;">RES</th>
                    </tr>
                </thead>
                <tbody id="data-table"></tbody>
            </table>
        </div>
    </div>
</div>

<div id="settings-modal" class="modal">
    <div class="modal-content">
        <h3>⚙️ ตั้งค่าระบบมาร์ติงเกล</h3>
        <div class="setting-row">
            <label for="max-step-select">จำนวนไม้ทบสูงสุด:</label>
            <select id="max-step-select" onchange="updateMaxStep(this.value)">
                <option value="1">1 ไม้</option>
                <option value="2">2 ไม้</option>
                <option value="3" selected>3 ไม้</option>
                <option value="4">4 ไม้</option>
                <option value="5">5 ไม้</option>
                <option value="6">6 ไม้</option>
            </select>
        </div>
        <button class="btn-close" onclick="closeSettings()">ตกลง / บันทึก</button>
    </div>
</div>

<script>
    let soundEnabled = true;
    let audioCtx = null;
    let lastSignaledLength = -1; 

    function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    function toggleSound() {
        soundEnabled = !soundEnabled;
        const btn = document.getElementById('sound-btn');
        if (soundEnabled) {
            btn.innerText = "🔊 เสียง: เปิด";
            btn.classList.remove('muted');
            initAudio();
            playAlertSound();
        } else {
            btn.innerText = "🔇 เสียง: ปิด";
            btn.classList.add('muted');
        }
    }

    function playAlertSound() {
        if (!soundEnabled) return;
        initAudio();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const now = audioCtx.currentTime;
        const osc1 = audioCtx.createOscillator();
        const gain1 = audioCtx.createGain();
        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(880, now);
        gain1.gain.setValueAtTime(0.3, now);
        gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
        osc1.connect(gain1);
        gain1.connect(audioCtx.destination);
        osc1.start(now);
        osc1.stop(now + 0.15);

        const osc2 = audioCtx.createOscillator();
        const gain2 = audioCtx.createGain();
        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(1760, now + 0.2);
        gain2.gain.setValueAtTime(0.4, now + 0.2);
        gain2.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
        osc2.connect(gain2);
        gain2.connect(audioCtx.destination);
        osc2.start(now + 0.2);
        osc2.stop(now + 0.5);
    }

    // สร้าง 16 คู่ (32 รูปแบบจาก 2^5)
    function generate16Pairs() {
        const list = [];
        for (let i = 0; i < 16; i++) {
            let mainStr = "";
            let mirrorStr = "";
            for (let bit = 4; bit >= 0; bit--) {
                const isSet = (i >> bit) & 1;
                mainStr += isSet ? "T" : "M";
                mirrorStr += isSet ? "M" : "T";
            }
            list.push({ name: `P${i + 1}`, main: mainStr, mirror: mirrorStr });
        }
        return list;
    }

    const pairs = generate16Pairs();
    const STEP_BACK = 6;
    let history = JSON.parse(localStorage.getItem('parallel_tracker_v16_h')) || [];
    let maxMartingale = parseInt(localStorage.getItem('parallel_tracker_max_step')) || 3;
    let signal = null; 

    document.getElementById('max-step-select').value = maxMartingale;
    document.getElementById('stat-max-step').innerText = maxMartingale + " ไม้";

    const thr = document.getElementById('table-head');
    pairs.forEach((p, idx) => {
        const thMain = document.createElement('th');
        thMain.id = `th-m-${idx}`;
        thMain.innerText = `${p.name}.M`;
        thr.appendChild(thMain);

        const thMirror = document.createElement('th');
        thMirror.id = `th-r-${idx}`;
        thMirror.innerText = `${p.name}.R`;
        thr.appendChild(thMirror);
    });

    function addResult(val) {
        initAudio();
        history.push(val);
        saveAndRender();
    }

    function getPrediction(patternStr, index) {
        const stepIdx = (index - STEP_BACK) % 5;
        const logic = patternStr[stepIdx];
        const baseVal = history[index - STEP_BACK];
        return (logic === "M") ? baseVal : (baseVal === 'P' ? 'B' : 'P');
    }

    function isFollowTrendFailed(pair, index) {
        if (index <= STEP_BACK) return false; 
        
        const prevIdx = index - 1;
        const predMainPrev = getPrediction(pair.main, prevIdx);
        const isMainPrevWin = (history[prevIdx] === predMainPrev);
        
        const activeSide = isMainPrevWin ? 'main' : 'mirror';
        
        if (activeSide === 'main') {
            const predMainCurr = getPrediction(pair.main, index);
            return history[index] !== predMainCurr; 
        } else {
            const predMirrorCurr = getPrediction(pair.mirror, index);
            return history[index] !== predMirrorCurr; 
        }
    }

    function getLatestWinSide(pair, index) {
        const prevIdx = index - 1;
        const predMainPrev = getPrediction(pair.main, prevIdx);
        const isMainPrevWin = (history[prevIdx] === predMainPrev);
        return isMainPrevWin ? 'main' : 'mirror';
    }

    function processMartingaleRounds() {
        let logs = [];
        let totalWin = 0, totalLoss = 0;
        let activeSignal = null;
        let currentStep = 1;
        let roundCount = 1;

        let i = STEP_BACK + 3;
        while (i <= history.length) {
            if (!activeSignal) {
                for (let idx = 0; idx < pairs.length; idx++) {
                    const p = pairs[idx];
                    const checkIdx = i - 1;
                    if (checkIdx >= STEP_BACK + 2) {
                        if (isFollowTrendFailed(p, checkIdx) &&
                            isFollowTrendFailed(p, checkIdx - 1) &&
                            isFollowTrendFailed(p, checkIdx - 2)) {
                            
                            activeSignal = { pairIdx: idx };
                            currentStep = 1;
                            break;
                        }
                    }
                }
            }

            if (activeSignal) {
                const p = pairs[activeSignal.pairIdx];
                const currentWinSide = getLatestWinSide(p, i);
                const pred = getPrediction(p[currentWinSide], i);

                if (i < history.length) {
                    const actual = history[i];

                    if (actual === pred) {
                        logs.push({ round: roundCount++, status: 'WIN', step: currentStep, pairIdx: activeSignal.pairIdx });
                        totalWin++;
                        activeSignal = null;
                        currentStep = 1;
                    } else {
                        if (currentStep < maxMartingale) {
                            currentStep++;
                        } else {
                            logs.push({ round: roundCount++, status: 'LOSS', step: maxMartingale, pairIdx: activeSignal.pairIdx });
                            totalLoss++;
                            activeSignal = null;
                            currentStep = 1;
                        }
                    }
                } else if (i === history.length) {
                    signal = { pairIdx: activeSignal.pairIdx, pred: pred, step: currentStep };
                }
            }

            i++;
        }

        if (!activeSignal) signal = null;

        return { logs, totalWin, totalLoss };
    }

    function renderTable() {
        const tbody = document.getElementById('data-table');
        tbody.innerHTML = "";
        
        pairs.forEach((_, idx) => {
            document.getElementById(`th-m-${idx}`).className = "";
            document.getElementById(`th-r-${idx}`).className = "";
        });

        const mData = processMartingaleRounds();

        if (signal && lastSignaledLength !== history.length) {
            playAlertSound();
            lastSignaledLength = history.length;
        }

        const displayCount = history.length + (history.length >= STEP_BACK ? 1 : 0);

        for (let i = 0; i < displayCount; i++) {
            const row = tbody.insertRow(-1);
            row.insertCell(0).innerText = i + 1;
            
            const cellRes = row.insertCell(1);
            cellRes.style.background = "#000";
            if (i < history.length) {
                cellRes.innerText = history[i];
                cellRes.className = (history[i] === 'P' ? 'p-text' : 'b-text');
            } else { 
                cellRes.innerText = "?"; 
            }

            if (i >= STEP_BACK) {
                pairs.forEach((p, idx) => {
                    const cellM = row.insertCell(-1);
                    const predM = getPrediction(p.main, i);
                    
                    const cellR = row.insertCell(-1);
                    const predR = getPrediction(p.mirror, i);

                    if (signal && i === history.length) {
                        if (signal.pairIdx === idx) {
                            cellM.classList.add('locked-col');
                            cellR.classList.add('locked-col');
                            document.getElementById(`th-m-${idx}`).classList.add('highlight-th');
                            document.getElementById(`th-r-${idx}`).classList.add('highlight-th');
                        }
                    }

                    if (i < history.length) {
                        const isWinM = (history[i] === predM);
                        cellM.className = isWinM ? "win" : "loss";
                        cellM.innerHTML = `${predM}<br><sup>${isWinM?'✅':'❌'}</sup>`;

                        const isWinR = (history[i] === predR);
                        cellR.className = isWinR ? "win" : "loss";
                        cellR.innerHTML = `${predR}<br><sup>${isWinR?'✅':'❌'}</sup>`;
                    } else {
                        cellM.innerHTML = `<span class="${predM==='P'?'p-text':'b-text'}" style="opacity:0.4">${predM}</span>`;
                        cellR.innerHTML = `<span class="${predR==='P'?'p-text':'b-text'}" style="opacity:0.4">${predR}</span>`;
                    }
                });
            } else {
                for(let j=0; j < pairs.length * 2; j++) row.insertCell(-1).innerText = "-";
            }
        }

        updateUI(mData.totalWin, mData.totalLoss, mData.logs);
        
        if (signal) {
            const targetTh = document.getElementById(`th-m-${signal.pairIdx}`);
            if (targetTh) {
                targetTh.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
            }
        }
    }

    function updateUI(w, l, logs) {
        document.getElementById('stat-win').innerText = w;
        document.getElementById('stat-loss').innerText = l;
        const rate = (w + l) > 0 ? ((w / (w + l)) * 100).toFixed(0) : 0;
        document.getElementById('stat-rate').innerText = rate + "%";

        const statusEl = document.getElementById('next-info');
        if (history.length < STEP_BACK) {
            statusEl.innerHTML = `<span class="wait-status">ฐานข้อมูลคีย์: ${history.length}/${STEP_BACK}</span>`;
        } else if (signal) {
            statusEl.innerHTML = `<div>PAIR ${signal.pairIdx + 1} แทงตาม: <span class="next-bet">${signal.pred === 'P' ? 'PLAYER (P)' : 'BANKER (B)'}</span> <span class="step-badge">ไม้ที่ ${signal.step}/${maxMartingale}</span></div>`;
        } else {
            statusEl.innerHTML = `<span class="wait-status">☕ รอสัญญาณ (สแกน 32 แพตเทิร์น / 16 คู่)</span>`;
        }

        const logBox = document.getElementById('history-log-box');
        if (logs.length === 0) {
            logBox.innerHTML = `<div style="color: #777; font-size: 10px; text-align: center;">--- ยังไม่มีประวัติการยิงสไนเปอร์ ---</div>`;
        } else {
            let html = "";
            logs.slice().reverse().forEach(item => {
                if (item.status === 'WIN') {
                    html += `<div class="log-item"><span>รอบที่ ${item.round} (PAIR ${item.pairIdx + 1})</span> <span class="log-win">ชนะ ไม้ ${item.step} ✅</span></div>`;
                } else {
                    html += `<div class="log-item"><span>รอบที่ ${item.round} (PAIR ${item.pairIdx + 1})</span> <span class="log-loss">แพ้ หลุดไม้ ${item.step} ❌</span></div>`;
                }
            });
            logBox.innerHTML = html;
        }
    }

    function openSettings() { document.getElementById('settings-modal').style.display = 'flex'; }
    function closeSettings() { document.getElementById('settings-modal').style.display = 'none'; }
    
    function updateMaxStep(val) {
        maxMartingale = parseInt(val);
        localStorage.setItem('parallel_tracker_max_step', maxMartingale);
        document.getElementById('stat-max-step').innerText = maxMartingale + " ไม้";
        renderTable();
    }

    function undo() { history.pop(); saveAndRender(); }
    function resetAll() { if(confirm("ต้องการล้างข้อมูลและประวัติทั้งหมดใช่ไหม?")) { history = []; signal = null; saveAndRender(); } }
    
    function saveAndRender() { 
        localStorage.setItem('parallel_tracker_v16_h', JSON.stringify(history)); 
        renderTable(); 
        const container = document.getElementById('scroll-area');
        container.scrollTop = container.scrollHeight;
    }

    renderTable();
</script>
</body>
</html>
